<style>
  html, body { margin: 0; height: 100%; background: #07050c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas#game { image-rendering: pixelated; image-rendering: crisp-edges; display: block; touch-action: none; cursor: default; }
  #turnstile { position: fixed; right: 12px; bottom: 12px; z-index: 5; }
  .say-field {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(78vw, 820px);
    font: 20px "Pixelify", "Fusion12", "Microsoft YaHei", "PingFang SC", sans-serif; color: #f4e9dc; background: #140a1e; border: 2px solid #b58cff;
    padding: 12px 14px; outline: none; z-index: 10; box-shadow: 0 0 0 4px #0b0714, 0 0 40px #b58cff55;
  }
  .say-field::placeholder { color: #6e6380; }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<div id="turnstile"></div>
<script type="module" src="/src/main.ts"></script>
</body>
